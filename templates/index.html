<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review for Vulnerabilities Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Code Review for Vulnerabilities</h1>
    <p class="subtitle">Select an example snippet or paste your own code to analyze.</p>

    <form id="reviewForm">
        <div class="form-group">
            <label for="exampleSelect">Load Example Snippet</label>
            <select id="exampleSelect">
                <option value="">-- Custom Code / Select Example --</option>
                <option value="sql_injection">SQL Injection</option>
                <option value="command_injection">Command Injection</option>
                <option value="weak_hash_and_secret">Weak Hash & Hardcoded Secret</option>
            </select>
        </div>

        <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="cpp">C / C++</option>
                <option value="go">Go</option>
            </select>
        </div>

        <div class="form-group">
            <label for="code">Source Code</label>
            <textarea id="code" name="code" rows="12" placeholder="Paste your code snippet here..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">Analyze Code</button>
    </form>

    <div id="resultsCard" class="results-card hidden">
        <h2>Analysis Results</h2>
        <div id="loadingText" class="hidden">Analyzing snippet for security vulnerabilities...</div>
        <div id="errorMessage" class="error hidden"></div>
        <pre id="output"></pre>
    </div>

    <!-- External JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
